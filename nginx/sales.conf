server {
    listen 80;
    server_name sales.palferia.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sales.palferia.me;

    ssl_certificate /etc/letsencrypt/live/sales.palferia.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales.palferia.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sales.palferia.me;
    index index.html;

    # CRM app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OpenWA proxy — adds API key header so browser JS doesn't need it
    location /wa/ {
        proxy_pass http://localhost:2785/;
        proxy_set_header X-Api-Key "M4rtin091121+";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
